<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>App Customer Care | Samira Home Decor</title>
<style>
body{margin:0;background:#faf8f3;color:#101f3a;font:16px system-ui,sans-serif} main{max-width:860px;margin:auto;padding:24px} section,article{background:white;border:1px solid #e8dcc8;border-radius:10px;padding:16px;margin:16px 0} button,input,select,textarea{font:inherit;padding:10px;margin:5px;max-width:100%;box-sizing:border-box} button{background:#101f3a;color:white;border:0;border-radius:8px;cursor:pointer} button:disabled{opacity:.55;cursor:default} img{display:block;max-width:100%;max-height:400px} textarea{display:block;width:100%;resize:vertical} [hidden]{display:none!important}
</style>
<script defer src="/js/app-customer-care-admin.js"></script>
</head>
<body><main>
<h1>App Customer Care</h1>
<form id="access"><label for="code">Owner admin access code</label><input id="code" type="password" autocomplete="off" required><button>Open inbox</button></form>
<p id="status" role="status" aria-live="polite"></p>
<div id="inbox" hidden>
<button id="refresh" type="button">Refresh inbox</button><button id="close" type="button">Close inbox</button>
<section><h2>Support &amp; return requests</h2><div id="tickets"></div></section>
<section><h2>Reviews awaiting approval</h2><div id="reviews"></div><div id="selected-review"></div></section>
</div>
</main></body>
</html>
