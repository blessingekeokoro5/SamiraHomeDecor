<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="canonical" href="https://samirahomedecor.com.au/wishlist.html">
  <title>My Wishlist, Samira Home Decor</title>
  <meta name="description" content="Your saved Samira Home Decor favourites.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon-sys.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-sys-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-sys-192.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon-sys.png">
  <link rel="stylesheet" href="css/styles.css?v=70">
</head>
<body data-page="wishlist.html">
  <div id="site-header"></div>

  <section class="page-banner">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">Home</a> / Wishlist</div>
      <span class="eyebrow">♡ Saved by you</span>
      <h1>My wishlist</h1>
      <p>Your favourite pieces, saved for later. Add them to your cart whenever you're ready.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div id="wishWrap"></div>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="js/data.js?v=99"></script>
  <script src="js/adairs-bathroom.js?v=1"></script>
  <script src="js/components.js?v=98"></script>
  <script src="js/cart.js?v=40"></script>
  <script src="js/main.js?v=22"></script>
  <script>
    function renderWishlistPage() {
      const wrap = document.getElementById("wishWrap");
      const ids = getWishlist();
      const items = ids.map(findProduct).filter(Boolean);
      if (!items.length) {
        wrap.innerHTML = `
          <div class="empty-state">
            <div class="em">♡</div>
            <h2>No favourites saved yet</h2>
            <p>Tap the ♡ on any product to save it here for later.</p>
            <div class="btn-row" style="justify-content:center;margin-top:20px">
              <a class="btn btn--primary" href="shop.html">Explore the shop</a>
              <a class="btn btn--outline" href="stylist.html">✦ Try Samira Stylera</a>
            </div>
          </div>`;
        return;
      }
      wrap.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:28px">
          <p style="margin:0;color:var(--muted)">${items.length} saved ${items.length === 1 ? "piece" : "pieces"}</p>
          <button class="btn btn--outline btn--sm" onclick="addAllWishToCart()">Add all to cart</button>
        </div>
        <div class="grid grid-4" id="wishGrid"></div>`;
      renderProducts("wishGrid", items);
      // Compare against prices observed on earlier visits on this device.
      let previous = {};
      try { previous = JSON.parse(localStorage.getItem("shd_wish_prices") || "{}") || {}; } catch {}
      const drops = items.filter(p => Number.isFinite(previous[p.id]) && Number.isFinite(p.price) && p.price < previous[p.id]);
      const next = Object.fromEntries(items.filter(p => Number.isFinite(p.price)).map(p => [p.id, p.price]));
      try { localStorage.setItem("shd_wish_prices", JSON.stringify(next)); } catch {}
      if (drops.length) {
        const notice = document.createElement("p");
        notice.setAttribute("role", "status");
        notice.style.cssText = "padding:14px;background:#faf6ed;color:#0b1f3a;border-radius:8px";
        notice.textContent = drops.length + " saved item(s) have dropped in price since your last wishlist visit.";
        wrap.prepend(notice);
      }
      initReveal();
    }
    function addAllWishToCart() {
      let added = 0, skipped = 0;
      getWishlist().forEach(id => {
        const p = findProduct(id);
        if (!p || isSoldOut(p) || p.available === false || p.soldOut || p.outOfStock || /sold out|out of stock/i.test(p.tag || "") || (p.sizes && p.sizes.length) || (p.colours && p.colours.length) || (p.colors && p.colors.length)) { skipped++; return; }
        addToCart(id); added++;
      });
      showToast(added + " item(s) added. " + (skipped ? skipped + " unavailable or requiring options; open the product page to check." : ""));
    }
    renderWishlistPage();
  </script>
</body>
</html>
