<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Stylera | Development Preview</title>
<style>
:root{font-family:"Jost",system-ui,sans-serif;color:#0B1F3A;background:#f4efe6}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.shell{width:min(100%,450px);background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 14px 50px #06152525}.head{background:#0B1F3A;color:white;padding:23px 24px;display:flex;gap:14px;align-items:center}.mark{background:#C6A15B;color:#0B1F3A;border-radius:50%;width:48px;height:48px;display:grid;place-items:center;font-size:25px}.head h1{font-size:23px;margin:0}.head small{color:#ead7b0}.body{padding:22px;min-height:350px;max-height:55vh;overflow:auto}.msg{max-width:90%;padding:13px 15px;border-radius:16px;margin:0 0 12px;line-height:1.5;white-space:pre-wrap}.bot{background:#f4efe6}.customer{background:#0B1F3A;color:white;margin-left:auto}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0}.choices button{background:white;border:1px solid #C6A15B;color:#0B1F3A;padding:12px 8px;border-radius:11px;cursor:pointer;font:inherit}.foot{border-top:1px solid #e6dcc9;padding:15px;display:flex;gap:9px}.foot input{flex:1;min-width:0;padding:13px;border:1px solid #d6c8ac;border-radius:11px;font:inherit}.foot button{background:#0B1F3A;color:white;border:0;border-radius:11px;padding:0 17px;cursor:pointer}.note{text-align:center;color:#655f57;font-size:12px;padding:0 15px 16px}.preview{background:#f9edd3;padding:10px 20px;font-size:12px;text-align:center}.sr-only{position:absolute;left:-9999px}button:focus-visible,input:focus-visible{outline:3px solid #C6A15B;outline-offset:2px}
</style></head><body><main class="shell"><div class="preview">Development preview only · not connected to live customers</div><header class="head"><div class="mark" aria-hidden="true">✦</div><div><h1>Stylera</h1><small>Your AI Stylist · Samira Home Decor</small></div></header><section id="conversation" class="body" role="log" aria-live="polite" aria-label="Chat conversation"><div class="msg bot">Hello! I'm Stylera ✨ I can help with shopping, home styling, orders and delivery. What would you like to explore?</div><div class="choices" id="choices"><button data-question="product">Find furniture</button><button data-question="styling">Style my room</button><button data-question="delivery">Delivery questions</button><button data-question="support">Customer support</button></div></section><form id="chat" class="foot"><label class="sr-only" for="question">Message Stylera</label><input id="question" maxlength="500" autocomplete="off" placeholder="Ask Stylera anything…" required><button type="submit">Send</button></form><div class="note">FAQ-only preview · no AI charges · no messages stored</div></main><script>
(function(){'use strict';const log=document.getElementById('conversation'),form=document.getElementById('chat'),input=document.getElementById('question');let count=0;const answers={
product:'Explore our furniture and home décor collections on the Samira Home Decor website. Tell me which room or product type you are looking for.',
styling:'I can suggest styling ideas. Tell me the room, your preferred colours, and the look you want. AI room-image previews are not enabled in this development preview.',
delivery:'Delivery charges depend on the product, quantity and destination. Please check your cart for the available delivery calculation. For an order-specific question, request human support.',
support:'For help with an existing order, refunds or a complaint, please contact hello@samirahomedecor.com.au. The private support inbox is not connected to this preview.'
};function add(text,cls){const el=document.createElement('div');el.className='msg '+cls;el.textContent=text;log.append(el);log.scrollTop=log.scrollHeight}function reply(q){if(count++>=12){add('This preview has reached its message limit. Please contact hello@samirahomedecor.com.au for further assistance.','bot');input.disabled=true;return}add(q,'customer');const s=q.toLowerCase();let a;if(/refund|complain|human|person|agent|order (number|issue)|damaged|wrong item|accessibility/.test(s))a=answers.support;else if(/deliver|shipping|postage|freight|postcode/.test(s))a=answers.delivery;else if(/room|styling|decorate|interior|preview|ar\b/.test(s))a=answers.styling;else if(/sofa|chair|furniture|product|shop|table|decor/.test(s))a=answers.product;else a='I can help with Samira Home Decor products, styling, delivery and customer support. Which of these do you need help with?';add(a,'bot')}document.querySelectorAll('[data-question]').forEach(b=>b.addEventListener('click',()=>reply(b.textContent)));form.addEventListener('submit',e=>{e.preventDefault();const q=input.value.trim();if(!q)return;input.value='';reply(q)})})();
</script></body></html>
