<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3EAD6"/><stop offset="1" stop-color="#E4CC94"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22355E"/><stop offset="1" stop-color="#14213F"/>
    </linearGradient>
    <linearGradient id="kraft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D6B07E"/><stop offset="1" stop-color="#B98C57"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6C766"/><stop offset="1" stop-color="#B8901F"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <ellipse cx="410" cy="440" rx="330" ry="26" fill="#000" opacity=".10"/>

  <!-- Gift box lid leaning behind -->
  <polygon points="262,262 538,262 552,132 276,132" fill="url(#navy)"/>
  <polygon points="276,132 552,132 552,142 276,142" fill="#C9A227"/>
  <circle cx="414" cy="198" r="22" fill="none" stroke="#C9A227" stroke-width="3"/>
  <text x="414" y="205" font-family="Georgia,serif" font-size="18" fill="#C9A227" text-anchor="middle">S</text>

  <!-- Box opening -->
  <polygon points="200,300 480,300 530,262 250,262" fill="#0F1A33"/>
  <!-- Tissue paper -->
  <path d="M215,300 C240,250 270,275 290,240 C310,270 335,235 360,255 C385,228 410,262 430,240 C455,262 470,248 480,300 Z" fill="#FFFFFF"/>
  <path d="M290,240 L300,300 M360,255 L365,300 M430,240 L425,300" stroke="#E8E1D2" stroke-width="2"/>
  <!-- Ribbon bow sitting in box -->
  <path d="M345,262 C315,232 300,262 340,272 Z M355,262 C385,232 400,262 360,272 Z" fill="url(#gold)"/>
  <circle cx="350" cy="266" r="7" fill="#B8901F"/>

  <!-- Box front & side -->
  <polygon points="200,300 480,300 480,425 200,425" fill="url(#navy)"/>
  <polygon points="480,300 530,262 530,385 480,425" fill="#101B36"/>
  <rect x="200" y="300" width="280" height="6" fill="#C9A227"/>
  <rect x="325" y="300" width="22" height="125" fill="url(#gold)" opacity=".95"/>
  <text x="262" y="375" font-family="Georgia,serif" font-size="15" fill="#E6C766" text-anchor="middle" letter-spacing="2">GIFT</text>
  <text x="412" y="375" font-family="Georgia,serif" font-size="15" fill="#E6C766" text-anchor="middle" letter-spacing="2">KIT</text>

  <!-- Ribbon spool -->
  <circle cx="135" cy="392" r="48" fill="url(#gold)"/>
  <circle cx="135" cy="392" r="36" fill="none" stroke="#A88219" stroke-width="2" opacity=".6"/>
  <circle cx="135" cy="392" r="16" fill="#F3EAD6"/>
  <path d="M175,420 C205,432 230,420 250,436" stroke="#C9A227" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- Stand-up kraft pouches -->
  <g>
    <path d="M590,200 h110 v220 a8,8 0 0 1 -8,8 h-94 a8,8 0 0 1 -8,-8 Z" fill="url(#kraft)"/>
    <rect x="590" y="200" width="110" height="10" fill="#A9804C"/>
    <line x1="596" y1="226" x2="694" y2="226" stroke="#A9804C" stroke-width="2" stroke-dasharray="4 3"/>
    <rect x="612" y="262" width="66" height="96" rx="8" fill="#FFFFFF" opacity=".55"/>
    <circle cx="645" cy="388" r="14" fill="#1F3A6B"/>
    <text x="645" y="393" font-family="Georgia,serif" font-size="13" fill="#E6C766" text-anchor="middle">S</text>
  </g>
  <g>
    <path d="M545,250 h85 v170 a7,7 0 0 1 -7,7 h-71 a7,7 0 0 1 -7,-7 Z" fill="#FFFFFF"/>
    <rect x="545" y="250" width="85" height="9" fill="#E3DACA"/>
    <line x1="550" y1="272" x2="625" y2="272" stroke="#D8CDB8" stroke-width="2" stroke-dasharray="4 3"/>
    <rect x="562" y="300" width="51" height="70" rx="6" fill="#EAF0FA"/>
    <circle cx="587" cy="398" r="12" fill="#C9A227"/>
  </g>

  <!-- Thank-you stickers -->
  <g>
    <circle cx="700" cy="452" r="22" fill="#1F3A6B" stroke="#C9A227" stroke-width="3"/>
    <text x="700" y="450" font-family="Arial,sans-serif" font-size="7" font-weight="700" fill="#E6C766" text-anchor="middle">THANK</text>
    <text x="700" y="460" font-family="Arial,sans-serif" font-size="7" font-weight="700" fill="#E6C766" text-anchor="middle">YOU</text>
    <circle cx="745" cy="440" r="18" fill="#FFFFFF" stroke="#C9A227" stroke-width="3"/>
    <text x="745" y="444" font-family="Georgia,serif" font-size="12" fill="#1F3A6B" text-anchor="middle">♥</text>
  </g>

  <!-- Gift tag -->
  <g transform="rotate(-14 90 250)">
    <path d="M60,225 h70 l18,22 l-18,22 h-70 Z" fill="#FFFFFF" stroke="#C9A227" stroke-width="2"/>
    <circle cx="133" cy="247" r="4" fill="#F3EAD6" stroke="#C9A227" stroke-width="1.5"/>
    <text x="95" y="252" font-family="Georgia,serif" font-size="13" font-style="italic" fill="#1F3A6B" text-anchor="middle">for you</text>
  </g>
</svg>
