<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Stylera | Private Support Inbox</title>
<style>:root{font-family:system-ui,sans-serif;color:#0B1F3A;background:#f4efe6}*{box-sizing:border-box}body{margin:0;padding:24px}.wrap{max-width:1000px;margin:auto}header,.panel{background:white;border:1px solid #e6dcc9;border-radius:16px;padding:24px;margin-bottom:16px}header{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.eyebrow{color:#a9843c;letter-spacing:.15em;font-size:12px;font-weight:800}h1{margin:6px 0;font-family:Georgia,serif}button{background:#0B1F3A;color:white;border:0;border-radius:10px;padding:12px 16px;cursor:pointer}button:disabled{opacity:.5}input,textarea,select{width:100%;border:1px solid #cbbd9f;border-radius:9px;padding:12px;font:inherit;margin:8px 0}textarea{min-height:100px}label{display:block;margin-top:12px;font-weight:600}#workspace[hidden],#loginPanel[hidden],#replyPanel[hidden],#actions[hidden],#signout[hidden]{display:none}.grid{display:grid;grid-template-columns:minmax(220px,1fr) 2fr;gap:16px}.ticket{display:block;text-align:left;background:#f4efe6;color:#0B1F3A;width:100%;margin:8px 0;overflow-wrap:anywhere}.ticket[aria-pressed=true]{outline:2px solid #C6A15B}.message{padding:12px;border-radius:10px;background:#f4efe6;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}.message.support{background:#e3eaf3}.muted{color:#665f55;font-size:13px}.status{min-height:1.5em}a{color:#0B1F3A}@media(max-width:650px){.grid{grid-template-columns:1fr}body{padding:12px}}</style></head>
<body><main class="wrap"><header><div><div class="eyebrow">SAMIRA HOME DECOR</div><h1>Stylera Support Inbox</h1><div class="muted">Private Supabase development preview · not linked to live storefront</div></div><button id="signout" hidden>Sign out</button></header>
<section class="panel" id="loginPanel"><h2>Owner sign-in</h2><p class="muted">Use the administrator email and password you created in Supabase Authentication.</p><form id="loginForm"><label for="email">Email</label><input type="email" id="email" autocomplete="username" required><label for="password">Password</label><input type="password" id="password" autocomplete="current-password" required><button type="submit">Sign in</button></form></section>
<p class="status" id="status" role="status" aria-live="polite"></p>
<section id="workspace" hidden><div class="grid"><section class="panel"><h2>Conversations</h2><button id="refresh" type="button">Refresh</button><label for="filter">Filter conversations</label><select id="filter" aria-label="Conversation status"><option value="all">All statuses</option><option value="open">Open</option><option value="escalated">Escalated</option><option value="closed">Closed</option></select><label for="search">Find conversation</label><input id="search" type="search" placeholder="Search conversation ID"><div id="tickets" class="muted">No conversations loaded.</div></section><section class="panel"><h2 id="selectedTitle">Select a conversation</h2><div id="messages" aria-live="polite"></div><div id="actions" hidden><label for="conversationStatus">Conversation status</label><select id="conversationStatus"><option value="open">Open</option><option value="escalated">Escalated</option><option value="closed">Closed</option></select><button type="button" id="saveStatus">Save status</button></div><form id="replyPanel" hidden><label for="reply">Reply as support</label><textarea id="reply" maxlength="3000" required></textarea><button type="submit">Send reply</button></form></section></div></section></main>
<script src="/js/stylera-supabase-config.js"></script>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const cfg=window.STYLERA_SUPABASE_CONFIG;
const status=document.getElementById('status'),loginPanel=document.getElementById('loginPanel'),workspace=document.getElementById('workspace'),signout=document.getElementById('signout'),tickets=document.getElementById('tickets'),messages=document.getElementById('messages'),replyPanel=document.getElementById('replyPanel');
let client,selected=null,conversations=[];
function say(s){status.textContent=s}
function reset(){selected=null;conversations=[];workspace.hidden=true;loginPanel.hidden=false;signout.hidden=true;replyPanel.hidden=true;tickets.replaceChildren();messages.replaceChildren()}
if(!cfg?.url||!cfg?.publishableKey){say('Supabase development configuration missing.');}else{
client=createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true}});
const {data:{session}}=await client.auth.getSession();if(session)await load();
}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();if(!client)return;const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;say('Signing in…');const {error}=await client.auth.signInWithPassword({email,password});document.getElementById('password').value='';if(error){say('Sign-in failed: '+error.message);return}await load()});
signout.addEventListener('click',async()=>{await client.auth.signOut();reset();say('Signed out.')});
async function load(){say('Checking support access…');const {data:staff,error:staffError}=await client.rpc('stylera_is_support_staff');if(staffError||staff!==true){reset();await client.auth.signOut();say('Access denied: this account is not authorized for Stylera support.');return}const {data,error}=await client.from('stylera_conversations').select('id,customer_id,status,created_at').order('created_at',{ascending:false}).limit(100);if(error){reset();say('Unable to load conversations: '+error.message);return}
conversations=data||[];loginPanel.hidden=true;workspace.hidden=false;signout.hidden=false;renderTickets();say('Support inbox ready. '+conversations.length+' conversation(s) loaded.')}
function renderTickets(){tickets.replaceChildren();if(!conversations.length){tickets.textContent='No customer conversations yet. The customer chat is not connected to this inbox.';return}const filter=document.getElementById('filter').value,term=document.getElementById('search').value.trim().toLowerCase();for(const c of conversations.filter(c=>(filter==='all'||c.status===filter)&&(!term||c.id.toLowerCase().includes(term)))){const b=document.createElement('button');b.type='button';b.className='ticket';b.setAttribute('aria-pressed',String(selected===c.id));b.textContent=c.status+' · '+new Date(c.created_at).toLocaleString()+' · '+c.id.slice(0,8);b.addEventListener('click',()=>selectConversation(c.id));tickets.append(b)}}
async function selectConversation(id){selected=id;renderTickets();messages.replaceChildren();say('Loading messages…');const {data,error}=await client.from('stylera_messages').select('sender,content,created_at').eq('conversation_id',id).order('created_at',{ascending:true}).limit(200);if(error){say('Unable to load messages: '+error.message);replyPanel.hidden=true;return}document.getElementById('selectedTitle').textContent='Conversation '+id.slice(0,8);for(const m of data||[]){const el=document.createElement('div');el.className='message '+(m.sender==='support'?'support':'');const strong=document.createElement('strong');strong.textContent=m.sender+' · '+new Date(m.created_at).toLocaleString();const p=document.createElement('p');p.textContent=m.content;el.append(strong,p);messages.append(el)}if(!(data||[]).length)messages.textContent='No messages yet.';const current=conversations.find(c=>c.id===id);document.getElementById('actions').hidden=!current;document.getElementById('conversationStatus').value=current?.status||'open';replyPanel.hidden=!current||current.status==='closed';say('Messages loaded.')}
document.getElementById('refresh').addEventListener('click',load);for(const event of ['change','input']){document.getElementById(event==='change'?'filter':'search').addEventListener(event,renderTickets)}
document.getElementById('saveStatus').addEventListener('click',async()=>{if(!selected)return;const next=document.getElementById('conversationStatus').value;if(!['open','escalated','closed'].includes(next))return;say('Updating conversation…');const {data,error}=await client.from('stylera_conversations').update({status:next}).eq('id',selected).select('id,status').single();if(error){say('Unable to update status: '+error.message);return}const item=conversations.find(c=>c.id===selected);if(item)item.status=data.status;renderTickets();replyPanel.hidden=data.status==='closed';say('Conversation marked '+data.status+'.')});
replyPanel.addEventListener('submit',async e=>{e.preventDefault();if(!selected)return;const box=document.getElementById('reply'),content=box.value.trim();if(!content)return;say('Sending reply…');const {error}=await client.from('stylera_messages').insert({conversation_id:selected,sender:'support',content});if(error){say('Reply not sent: '+error.message);return}box.value='';await selectConversation(selected);say('Support reply saved to conversation. Customer notification is not configured yet.')});
</script></body></html>
