<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="canonical" href="https://samirahomedecor.com.au/account.html">
  <title>My Account, Samira Home Decor</title>
  <meta name="description" content="Log in or sign up to your Samira Home Decor account, manage your membership, view your vouchers and saved favourites.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon-sys.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-sys-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-sys-192.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon-sys.png">
  <link rel="stylesheet" href="css/styles.css?v=70">
  <style>
    .acc-tabs { display: flex; gap: 8px; margin-bottom: 22px; }
    .acc-tabs button { flex: 1; padding: 12px; border: 1.5px solid var(--line); background: #fff; border-radius: var(--radius-sm);
      font-family: var(--font-body); font-size: 0.9rem; color: var(--ink); cursor: pointer; transition: all var(--tr); }
    .acc-tabs button.active { background: var(--rose); color: #fff; border-color: var(--rose); }
    /* Social sign-in (Continue with Google / Apple) */
    .sso-btns { display: flex; flex-direction: column; gap: 12px; margin-bottom: 6px; }
    .sso-btn { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 13px 16px;
      border: 1.5px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink);
      font-family: var(--font-body); font-size: 0.98rem; font-weight: 500; cursor: pointer; transition: all var(--tr); }
    .sso-btn:hover { background: var(--cream-2); border-color: var(--ink); }
    .sso-btn svg, .sso-btn img { width: 20px; height: 20px; flex: none; }
    .sso-apple { background: #000; color: #fff; border-color: #000; }
    .sso-apple:hover { background: #1a1a1a; border-color: #1a1a1a; }
    .auth-or { display: flex; align-items: center; gap: 14px; margin: 18px 0; color: var(--muted); font-size: 0.85rem; }
    .auth-or::before, .auth-or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .pw-wrap { position: relative; }
    .pw-wrap input { width: 100%; padding-right: 44px; }
    .pw-toggle { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none;
      cursor: pointer; padding: 6px; color: var(--muted); line-height: 0; }
    .pw-toggle:hover { color: var(--ink); }
    .auth-legal { font-size: 0.78rem; color: var(--muted); line-height: 1.6; margin-top: 16px; text-align: center; }
    .auth-legal a { color: var(--rose-deep); text-decoration: underline; }
    .forgot-link { display: block; text-align: right; font-size: 0.85rem; color: var(--rose-deep); margin: -6px 0 14px; }
    /* Membership card, matches the gift-card shape/style, in Samira Home Decor green */
    .mcard { position: relative; overflow: hidden; color: #fff; border-radius: 22px; aspect-ratio: 1.62/1;
      padding: 26px 30px; display: flex; flex-direction: column; justify-content: space-between;
      background:
        radial-gradient(110% 130% at 15% 10%, rgba(255,255,255,0.18), rgba(255,255,255,0) 45%),
        linear-gradient(140deg, #16304f 0%, var(--forest) 55%, #061525 100%);
      box-shadow: 0 24px 50px -22px rgba(11,31,58,0.7), inset 0 0 0 1px rgba(198,161,91,0.45); }
    .mcard::before { content: ""; position: absolute; inset: 0; pointer-events: none;
      background-image: radial-gradient(rgba(255,255,255,0.12) 1px, transparent 1.5px); background-size: 15px 15px; opacity: 0.5; }
    .mcard::after { content: ""; position: absolute; top: -60%; left: -25%; width: 55%; height: 210%; pointer-events: none;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.16) 50%, rgba(255,255,255,0) 100%); transform: rotate(18deg); }
    .mc-frame { position: absolute; inset: 11px; border: 1px solid rgba(198,161,91,0.5); border-radius: 15px; pointer-events: none; }
    .mcard > * { position: relative; z-index: 1; }
    .coupon { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: rgba(255,255,255,0.12);
      border: 1px dashed rgba(255,255,255,0.5); border-radius: var(--radius-sm); padding: 16px 18px; margin-top: 24px; }
    .coupon .code { font-family: var(--font-head); font-size: 1.5rem; letter-spacing: 0.08em; color: #fff; }
    .coupon small { display: block; color: #d9e2ef; font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; }
    .acc-links { display: grid; grid-template-columns: repeat(auto-fit,minmax(150px,1fr)); gap: 12px; margin-top: 24px; }
    .acc-link { background: #fff; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 18px; text-align: center; color: var(--ink); }
    .acc-link:hover { background: var(--cream-2); }
    .acc-link .ic { font-size: 1.5rem; }
    .acc-stylera { display: flex; align-items: center; gap: 16px; margin-top: 24px; padding: 20px 22px; border-radius: var(--radius-sm); background: var(--navy, #0B1F3A); color: #fff; border: 1px solid var(--gold, #C6A15B); }
    .acc-stylera:hover { filter: brightness(1.08); }
    .acc-stylera .as-ic { flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--gold, #C6A15B); color: var(--navy, #0B1F3A); display: grid; place-items: center; font-size: 1.3rem; }
    .acc-stylera .as-txt { flex: 1; min-width: 0; }
    .acc-stylera strong { display: block; font-family: var(--font-head); font-size: 1.2rem; color: #fff; }
    .acc-stylera .as-txt span { display: block; font-size: 0.88rem; color: #D9DFEA; margin-top: 2px; }
    .acc-stylera .as-go { flex: none; background: var(--gold, #C6A15B); color: var(--navy, #0B1F3A); font-weight: 600; font-size: 0.85rem; padding: 10px 16px; border-radius: 999px; white-space: nowrap; }
    @media (max-width: 560px) { .acc-stylera { flex-wrap: wrap; } .acc-stylera .as-go { width: 100%; text-align: center; } }
    .mc-top { display: flex; justify-content: space-between; align-items: center; }
    .mc-brand { font-family: var(--font-head); font-size: 1.6rem; font-weight: 700; letter-spacing: 0.01em; }
    .mc-emblem { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 1.1rem;
      background: rgba(198,161,91,0.28); border: 1px solid rgba(198,161,91,0.6); color: #f2e2bd; }
    .mc-eyebrow { display: block; letter-spacing: 0.28em; text-transform: uppercase; font-size: 0.62rem; color: #e4d3a6; margin-bottom: 6px; }
    .mc-name { font-family: var(--font-head); font-weight: 600; font-size: clamp(1.15rem, 4.4vw, 1.9rem); line-height: 1.1;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .mc-foot { display: flex; gap: 30px; align-items: flex-end; }
    .mc-field small { display: block; font-size: 0.58rem; letter-spacing: 0.14em; text-transform: uppercase; color: #b9c4d4; margin-bottom: 3px; }
    .mc-field strong { font-size: 0.95rem; letter-spacing: 0.05em; font-family: 'Jost', monospace; font-weight: 500; }
    @media (max-width: 480px){ .mcard { padding: 20px 20px; } .mc-name { font-size: clamp(1.05rem, 6vw, 1.5rem); } .mc-foot { gap: 20px; } .mc-brand { font-size: 1.35rem; } }
    .reward { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--blush);
      border: 1px dashed var(--rose-soft); border-radius: var(--radius-sm); padding: 16px 18px; margin-top: 22px; }
    .reward .code { font-family: var(--font-head); font-size: 1.4rem; color: var(--rose-deep); letter-spacing: 0.06em; }
    .reward small { display: block; color: var(--muted); font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; }
    .orders-list { margin-top: 14px; }
    .order-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; border: 1px solid var(--line);
      border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; background: #fff; }
    .order-row .o-meta strong { display: block; }
    .order-row .o-meta small { color: var(--muted); font-size: 0.82rem; }
    .acc-h3 { font-size: 1.2rem; margin: 30px 0 4px; }
    .ar-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-top: 14px; }
    .ar-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 18px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
    .ar-card .ar-ic { font-size: 1.5rem; }
    .ar-card h4 { font-family: var(--font-head); font-size: 1.1rem; color: var(--ink); margin: 0; }
    .ar-card p { font-size: 0.9rem; margin: 0 0 8px; flex: 1; }
    .ref-prog { background: #fff; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 16px 18px; margin-top: 12px; }
    .ref-prog h4 { font-family: var(--font-head); font-size: 1.05rem; color: var(--ink); margin: 0 0 4px; }
    .ref-prog p { font-size: 0.9rem; margin: 0; }
    .ref-prog ul { list-style: none; margin: 10px 0 0; padding: 0; }
    .ref-prog li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; padding: 8px 0; border-top: 1px dashed var(--line); font-size: 0.9rem; }
    .xmas-card { background: #fff; border: 1.5px solid var(--gold); border-radius: var(--radius-lg); padding: 22px 24px; margin-top: 14px; }
    .xm-top { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .xm-label { display: block; font-size: 0.74rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    .xm-tier { font-family: var(--font-head); font-size: 1.5rem; color: var(--ink); margin-top: 2px; }
    .xm-dots { display: flex; gap: 6px; margin-top: 6px; }
    .xm-dot { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 0.8rem; color: var(--muted); }
    .xm-dot.on { background: var(--gold); border-color: var(--gold); color: var(--forest); font-weight: 700; }
    .xm-spend { margin-top: 14px; color: var(--ink); }
    .xm-spend .xm-label { display: inline; margin-right: 6px; }
    .xm-track { position: relative; margin: 12px 6px 46px; }
    .xm-bar { height: 10px; background: var(--cream-2, #F3EDE3); border-radius: 99px; overflow: hidden; }
    .xm-bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--forest), var(--gold)); border-radius: 99px; }
    .xm-mark { position: absolute; top: -3px; transform: translateX(-50%); text-align: center; font-size: 0.7rem; line-height: 1.2; color: var(--muted); }
    .xm-mark:last-child { transform: translateX(-100%); text-align: right; }
    .xm-mark i { display: block; width: 3px; height: 16px; background: var(--line); margin: 0 auto 4px; border-radius: 2px; }
    .xm-mark:last-child i { margin-right: 0; }
    .xm-mark.hit i { background: var(--gold); }
    .xm-mark b { display: block; color: var(--ink); font-weight: 600; }
    .xm-mark em { font-style: normal; }
    .xm-msg { margin: 0; color: var(--ink); }
    .xm-fine { margin: 10px 0 0; font-size: 0.78rem; color: var(--muted); }

    .voucher { display: flex; justify-content: space-between; align-items: center; gap: 12px; border: 1px dashed var(--rose-soft); background: var(--blush); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
    .voucher .v-amt { font-family: var(--font-head); font-size: 1.3rem; color: var(--rose-deep); }
    .voucher .v-code { font-size: .78rem; color: var(--muted); letter-spacing: .04em; }

  </style>
</head>
<body data-page="account.html">
  <div id="site-header"></div>

  <section class="page-banner">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">Home</a> / My Account</div>
      <span class="eyebrow">Your account</span>
      <h1 id="accTitle">My account</h1>
      <p id="accSub">Log in or create a free account to manage your membership, coupon and saved favourites.</p>
    </div>
  </section>

  <section class="section">
    <div class="container" style="max-width:760px">
      <div id="accWrap"></div>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="js/data.js?v=99"></script>
  <script src="js/components.js?v=98"></script>
  <script src="js/cart.js?v=39"></script>
  <script src="js/main.js?v=22"></script>
  <script src="js/order-status.js?v=3"></script>
  <script>
    let accMode = "signup";
    if (location.hash === "#login") accMode = "login";
    // Passwordless (one-time code) login state
    let authStep = "email";   // "email" | "code"
    let authEmail = "", authName = "";

    function render() {
      const acc = getAccount();
      const wrap = document.getElementById("accWrap");
      if (acc && acc.email) { renderDashboard(acc); return; }

      document.getElementById("accTitle").textContent = "My account";
      wrap.innerHTML = `
        <div class="form-card reveal">
          <div class="acc-tabs">
            <button class="${accMode==='login'?'active':''}" onclick="setMode('login')">Sign in</button>
            <button class="${accMode==='signup'?'active':''}" onclick="setMode('signup')">Create account</button>
          </div>
          <div class="sso-btns">
            <button type="button" class="sso-btn" onclick="socialAuth('google')">
              <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
              Continue with Google
            </button>
            <button type="button" class="sso-btn sso-apple" onclick="socialAuth('apple')">
              <svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M16.365 1.43c0 1.14-.417 2.2-1.11 2.98-.75.85-1.98 1.51-3.02 1.43-.13-1.1.44-2.26 1.09-2.99.73-.83 2.02-1.45 3.04-1.42zM20.5 17.03c-.55 1.27-.82 1.84-1.53 2.96-.99 1.57-2.39 3.52-4.12 3.53-1.54.02-1.94-1-4.03-.99-2.09.01-2.53 1.01-4.07.99-1.73-.02-3.05-1.78-4.04-3.35-2.77-4.38-3.06-9.52-1.35-12.25 1.21-1.94 3.13-3.08 4.93-3.08 1.84 0 2.99 1.01 4.51 1.01 1.47 0 2.37-1.01 4.5-1.01 1.61 0 3.32.88 4.53 2.4-3.98 2.18-3.34 7.87.26 9.24z"/></svg>
              Continue with Apple
            </button>
          </div>
          <div class="auth-or">or</div>
          <div id="accForm"></div>
        </div>`;
      renderForm();
      initReveal();
    }

    function setMode(m){ accMode = m; authStep = "email"; render(); }

    function renderForm() {
      const el = document.getElementById("accForm");
      const legal = `<p class="auth-legal">By continuing with Google, Apple or email you agree to our <a href="policy.html?doc=terms">Terms &amp; Privacy Policy</a>, and to receiving marketing communications from us. Unsubscribe at any time.</p>`;
      if (authStep === "code") { renderCodeStep(el); return; }
      if (accMode === "signup") {
        el.innerHTML = `
          <div style="background:var(--blush);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:20px;font-size:0.9rem;color:var(--rose-deep)">
            🎉 Join free and get <strong>10% off one item in your first order</strong> plus member perks.
          </div>
          <form onsubmit="return requestCode(event)">
            <div class="field"><label>Full name</label><input id="suName" autocomplete="name" required></div>
            <div class="field"><label>Email</label><input id="authEmailInput" type="email" autocomplete="email" required></div>
            <button type="submit" class="btn btn--primary btn--block" id="authSendBtn">Email me a login code</button>
            <p class="form-note" style="text-align:center;margin-top:12px">No password needed — we'll email you a one-time code to sign in.</p>
          </form>
          ${legal}`;
      } else {
        el.innerHTML = `
          <form onsubmit="return requestCode(event)">
            <div class="field"><label>Email</label><input id="authEmailInput" type="email" autocomplete="email" required></div>
            <button type="submit" class="btn btn--primary btn--block" id="authSendBtn">Email me a login code</button>
            <p class="form-note" style="text-align:center;margin-top:12px">No password needed — we'll email you a one-time code. New here? <a href="#" onclick="setMode('signup');return false;">Create an account</a> for 10% off one item in your first order.</p>
          </form>
          ${legal}`;
      }
    }

    function renderCodeStep(el) {
      el.innerHTML = `
        <div style="background:var(--blush);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:20px;font-size:0.9rem;color:var(--rose-deep)">
          ✉️ We've emailed a 6-digit code to <strong>${authEmail}</strong>. Enter it below to sign in. It expires in 10 minutes.
        </div>
        <form onsubmit="return verifyCode(event)">
          <div class="field"><label>6-digit code</label>
            <input id="authCodeInput" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="\\d{6}" required
                   style="letter-spacing:.34em;font-size:1.3rem;text-align:center;font-family:'Jost',monospace"></div>
          <button type="submit" class="btn btn--primary btn--block" id="authVerifyBtn">Verify &amp; sign in</button>
          <div id="authMsg" style="font-size:0.86rem;margin-top:10px;text-align:center"></div>
          <p class="form-note" style="text-align:center;margin-top:12px">
            <a href="#" onclick="resendCode();return false;">Resend code</a> &nbsp;·&nbsp;
            <a href="#" onclick="backToEmail();return false;">Use a different email</a>
          </p>
        </form>`;
    }

    function authSetMsg(cls, msg) {
      const m = document.getElementById("authMsg");
      if (m) { m.style.color = cls === "err" ? "var(--rose-deep)" : "var(--muted)"; m.textContent = msg; }
    }

    // Step 1 — send a one-time code to the shopper's email
    async function requestCode(e) {
      e.preventDefault();
      const email = (document.getElementById("authEmailInput").value || "").trim();
      if (!/.+@.+\..+/.test(email)) { showToast("Please enter a valid email"); return false; }
      const nameEl = document.getElementById("suName");
      authName = nameEl ? (nameEl.value || "").trim() : "";
      authEmail = email;
      const btn = document.getElementById("authSendBtn");
      if (btn) { btn.disabled = true; btn.textContent = "Sending code…"; }
      try {
        const r = await fetch("/.netlify/functions/auth-request-code", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, name: authName }),
        });
        const j = await r.json().catch(() => ({}));
        if (r.status === 429) { showToast("Too many codes requested — please wait a few minutes."); resetSendBtn(); return false; }
        if (r.status === 503) { showToast("Login by email isn't available right now. Please try again later."); resetSendBtn(); return false; }
        if (!r.ok || !j.ok) throw new Error("fail");
        authStep = "code"; renderForm();
        setTimeout(() => { const c = document.getElementById("authCodeInput"); if (c) c.focus(); }, 50);
      } catch (err) {
        showToast("Couldn't send the code. Please try again.");
        resetSendBtn();
      }
      return false;
    }
    function resetSendBtn() { const b = document.getElementById("authSendBtn"); if (b) { b.disabled = false; b.textContent = "Email me a login code"; } }

    // Step 2 — verify the code and sign in
    async function verifyCode(e) {
      e.preventDefault();
      const code = (document.getElementById("authCodeInput").value || "").trim();
      if (!/^\d{6}$/.test(code)) { authSetMsg("err", "Enter the 6-digit code from your email."); return false; }
      const btn = document.getElementById("authVerifyBtn");
      if (btn) { btn.disabled = true; btn.textContent = "Verifying…"; }
      try {
        const r = await fetch("/.netlify/functions/auth-verify-code", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: authEmail, code }),
        });
        const j = await r.json().catch(() => ({}));
        if (r.status === 401) { authSetMsg("err", "That code isn't right" + (typeof j.remaining === "number" ? ` — ${j.remaining} attempt(s) left.` : ".")); resetVerifyBtn(); return false; }
        if (r.status === 400 && (j.error === "expired" || j.error === "no_code")) { authSetMsg("err", "That code has expired. Please request a new one."); resetVerifyBtn(); return false; }
        if (r.status === 429) { authSetMsg("err", "Too many attempts. Please request a new code."); resetVerifyBtn(); return false; }
        if (!r.ok || !j.ok) throw new Error("fail");
        try { localStorage.setItem("shd_auth_token", j.token || ""); } catch (_) {}
        finishLogin(j.email || authEmail, j.name || authName);
      } catch (err) {
        authSetMsg("err", "Couldn't verify right now. Please try again.");
        resetVerifyBtn();
      }
      return false;
    }
    function resetVerifyBtn() { const b = document.getElementById("authVerifyBtn"); if (b) { b.disabled = false; b.textContent = "Verify & sign in"; } }

    async function resendCode() {
      if (!authEmail) { backToEmail(); return; }
      try {
        const r = await fetch("/.netlify/functions/auth-request-code", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: authEmail, name: authName }),
        });
        if (r.status === 429) { showToast("Please wait a moment before requesting another code."); return; }
        if (!r.ok) throw new Error("fail");
        showToast("New code sent ✉️");
      } catch (e) { showToast("Couldn't resend the code. Please try again."); }
    }
    function backToEmail() { authStep = "email"; renderForm(); }

    // Build (or reload) the verified member account after a successful code check
    function finishLogin(email, name) {
      const existing = getAccount() || {};
      const sameUser = existing.email && existing.email.toLowerCase() === String(email).toLowerCase();
      const base = sameUser ? existing : {};
      const acc = Object.assign({}, base, {
        email,
        name: name || base.name || "",
        provider: "Email",
        verified: true,
        member: true,
        memberSince: base.memberSince || todayAU(),
        memberNo: base.memberNo || genMemberNo(),
        orders: base.orders || [],
        vouchers: base.vouchers || [{ code: genVoucherCode(), pct: 10, label: "Welcome voucher" }],
      });
      saveAccount(acc);
      try { localStorage.setItem("dm_member", "1"); } catch (_) {}
      authStep = "email";
      showToast("You're signed in ✦");
      render();
    }

    // ---- Continue with Google / Apple ----
    // Real SSO: set GOOGLE_CLIENT_ID (Google Cloud OAuth) to enable true Google Sign-In.
    // Until then, these give a one-tap quick join into the Samira Home Decor membership.
    const GOOGLE_CLIENT_ID = ""; // paste your OAuth Client ID here to enable real Google login
    function socialAuth(provider) {
      const label = provider === "google" ? "Google" : "Apple";
      if (provider === "google" && GOOGLE_CLIENT_ID && window.google && google.accounts) {
        google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onGoogleCredential });
        google.accounts.id.prompt();
        return;
      }
      // Quick-join fallback (works today, no OAuth setup needed)
      const email = prompt(`Continue with ${label}\n\nEnter your email to sign in or create your free Samira Home Decor account:`);
      if (!email || !/.+@.+\..+/.test(email)) { if (email) showToast("Please enter a valid email"); return; }
      const existing = getAccount();
      if (existing && existing.email) { existing.email = email; existing.provider = label; saveAccount(existing); showToast("Welcome back! 👋"); render(); return; }
      saveAccount({ name: "", email, provider: label, member: true, memberSince: todayAU(),
        memberNo: genMemberNo(), orders: [], vouchers: [{ code: genVoucherCode(), pct: 10, label: "Welcome voucher" }] });
      try { localStorage.setItem("dm_member", "1"); } catch (err) {}
      showToast(`Signed in with ${label}, welcome to Samira Home Decor! 🎉`);
      render();
    }
    function onGoogleCredential(resp) {
      try {
        const p = JSON.parse(atob(resp.credential.split(".")[1]));
        const existing = getAccount() || {};
        saveAccount(Object.assign(existing, { name: p.name || existing.name || "", email: p.email, provider: "Google",
          member: true, memberSince: existing.memberSince || todayAU(),
          memberNo: existing.memberNo || genMemberNo(), orders: existing.orders || [],
          vouchers: existing.vouchers || [{ code: genVoucherCode(), pct: 10, label: "Welcome voucher" }] }));
        try { localStorage.setItem("dm_member", "1"); } catch (err) {}
        showToast("Signed in with Google 🎉"); render();
      } catch (e) { showToast("Google sign-in could not be completed"); }
    }

    function renderDashboard(acc) {
      // Ensure every member has a stable membership number
      let changed = false;
      if (!acc.memberNo) { acc.memberNo = genMemberNo(); changed = true; }
      if (!Array.isArray(acc.orders)) { acc.orders = getStoredOrders(acc.email); changed = true; }
      if (!Array.isArray(acc.vouchers)) { acc.vouchers = []; changed = true; }
      // Members without a first-order offer yet get the 10% welcome offer
      if ("coupon" in acc) {
        if (!acc.orders.length && !acc.vouchers.some(v => /welcome/i.test(v.label || ""))) acc.vouchers.push({ code: genVoucherCode(), pct: 10, label: "Welcome voucher" });
        delete acc.coupon;
        changed = true;
      }
      // The points program has ended: convert any balance into $10 vouchers once
      if ("points" in acc) {
        for (let i = 0; i < Math.floor((acc.points || 0) / 100); i++) acc.vouchers.push({ code: genVoucherCode(), pct: 10, label: "Points reward" });
        delete acc.points;
        changed = true;
      }
      if (changed) saveAccount(acc);

      document.getElementById("accTitle").textContent = acc.name ? `Hello, ${acc.name.split(" ")[0]} 👋` : "My account";
      document.getElementById("accSub").textContent = "Your membership card, coupon, orders and saved favourites.";
      const wishN = wishlistCount();
      const orders = acc.orders || [];
      document.getElementById("accWrap").innerHTML = `
        <div class="mcard reveal" id="memberCard">
          <div class="mc-frame"></div>
          <div class="mc-top"><span class="mc-brand">SYS</span><span class="mc-emblem">✦</span></div>
          <div class="mc-mid">
            <span class="mc-eyebrow">Member Card</span>
            <div class="mc-name">${acc.name || acc.email}</div>
          </div>
          <div class="mc-foot">
            <div class="mc-field"><small>Member No.</small><strong id="memberNo">${acc.memberNo}</strong></div>
            <div class="mc-field"><small>Member since</small><strong>${acc.memberSince || "today"}</strong></div>
          </div>
        </div>
        <div style="text-align:center;margin:16px 0 4px">
          <button class="btn btn--dark btn--sm" onclick="downloadCard()">⬇ Download member card</button>
          <p class="form-note" style="margin-top:8px">Keep this card for identification and security when you shop with us in store or by phone.</p>
        </div>

        <h3 class="acc-h3">Your member rewards</h3>
        ${memberRewardsHtml(acc)}
        ${xmasHtml(orders)}

        <h3 class="acc-h3">Your orders &amp; receipts</h3>
        <div class="orders-list" id="ordersList">${renderOrders(orders)}</div>

        <a class="acc-stylera" href="stylist.html">
          <span class="as-ic" aria-hidden="true">✦</span>
          <span class="as-txt"><strong>Samira Stylera</strong><span>Upload a photo of your room, get pieces picked for it and see them placed in your space.</span></span>
          <span class="as-go">Style my room →</span>
        </a>

        <div class="acc-links">
          <a class="acc-link" href="wishlist.html"><div class="ic">♡</div><strong>Wishlist</strong><div style="color:var(--muted);font-size:0.85rem">${wishN} saved</div></a>
          <a class="acc-link" href="track.html"><div class="ic">📦</div><strong>Track order</strong><div style="color:var(--muted);font-size:0.85rem">View status</div></a>
          <a class="acc-link" href="cart.html"><div class="ic">🛒</div><strong>My cart</strong><div style="color:var(--muted);font-size:0.85rem">${cartCount()} items</div></a>
          <a class="acc-link" href="shop.html"><div class="ic">🛍️</div><strong>Shop</strong><div style="color:var(--muted);font-size:0.85rem">Keep browsing</div></a>
        </div>

        <div style="text-align:center;margin-top:28px">
          <button class="btn btn--outline btn--sm" onclick="doLogout()">Log out</button>
        </div>`;
      initReveal();
      if (typeof renderReferralProgress === "function") renderReferralProgress(document.getElementById("refProgress"), acc.email, acc.name);
    }

    // ---- Membership number ----
    function genMemberNo() {
      const n = Math.floor(1000000000 + Math.random() * 8999999999).toString();
      return n.slice(0, 4) + " " + n.slice(4, 7) + " " + n.slice(7);
    }

    // ---- Member vouchers ----
    function genVoucherCode() { return "SHD-V" + Math.floor(1000 + Math.random() * 9000) + "-" + Math.floor(1000 + Math.random() * 9000); }
    // ---- Christmas Vouchers progress (rules: christmas-vouchers.html) ----
    // 3+ qualifying orders ($100+ after discounts, excluding shipping) placed 1 Jan – 24 Dec.
    // Tier is set by the combined total of those orders.
    const XMAS_TIERS = [
      { name: "Silver", min: 0, amt: 50 },
      { name: "Sapphire", min: 1500, amt: 100 },
      { name: "Gold", min: 3500, amt: 300 }
    ];
    // Only home decor items count: gift cards, vouchers, hampers, gift items and packaging don't.
    function xmasIsDecor(it) {
      return !it.giftCard && it.cat !== "Packaging" && !/gift|hamper|voucher/i.test((it.name || "") + " " + (it.cat || ""));
    }
    // An order's value after discounts and shipping, in proportion to its home decor items
    function xmasValue(o) {
      const net = (o.total || 0) - (o.shipping || 0);
      const items = o.items || [];
      const line = (it) => (it.price || 0) * (it.qty || 1);
      const all = items.reduce((t, it) => t + line(it), 0);
      if (!all) return net;
      return net * items.filter(xmasIsDecor).reduce((t, it) => t + line(it), 0) / all;
    }
    function xmasHtml(orders) {
      const now = new Date(new Date().toLocaleString("en-US", { timeZone: "Australia/Adelaide" }));
      const yr = now.getFullYear();
      const from = yr + "-01-01", to = yr + "-12-24";
      const q = (orders || []).filter(o => {
        const d = (o.date || "").slice(0, 10);
        return d >= from && d <= to && xmasValue(o) >= 100 && !o.refunded && !o.cancelled;
      });
      const n = q.length, total = q.reduce((t, o) => t + xmasValue(o), 0);
      const tier = n >= 3 ? XMAS_TIERS.filter(t => total >= t.min).pop() : null;
      const next = XMAS_TIERS.find(t => t.min > total && t.min > 0);
      const closed = (now.getMonth() === 11 && now.getDate() > 24);
      const dots = [0, 1, 2].map(i => `<span class="xm-dot${i < n ? " on" : ""}">${i < n ? "✓" : i + 1}</span>`).join("");
      const pct = Math.min(100, total / 5000 * 100);
      const marks = XMAS_TIERS.filter(t => t.min > 0).map(t => `<span class="xm-mark${n >= 3 && total >= t.min ? " hit" : ""}" style="left:${t.min / 5000 * 100}%"><i></i><b>${t.name}</b><em>${money(t.min)}</em></span>`).join("");
      let msg;
      if (closed) msg = tier ? `You reached <strong>${tier.name}</strong>! Your <strong>$${tier.amt} voucher</strong> will be emailed by 26 December.` : `This year's tracking closed on 24 December. Your progress starts again on 1 January.`;
      else if (n < 3) msg = `<strong>${3 - n} more qualifying order${3 - n === 1 ? "" : "s"}</strong> by 24 December to earn at least a <strong>$50 Silver</strong> voucher.`;
      else msg = `You've unlocked <strong>${tier.name} · $${tier.amt}</strong>!` + (next ? ` Spend <strong>${money(next.min - total)}</strong> more by 24 December to reach <strong>${next.name} · $${next.amt}</strong>.` : " That's our top tier.");
      return `
        <div class="xmas-card">
          <div class="xm-top">
            <div><span class="xm-label">🎄 ${yr} Christmas voucher</span>
              <div class="xm-tier">${tier ? tier.name + " · $" + tier.amt : "Not unlocked yet"}</div></div>
            <div class="xm-orders"><span class="xm-label">Qualifying orders</span><div class="xm-dots">${dots}</div></div>
          </div>
          <div class="xm-spend"><span class="xm-label">Combined total</span> <strong>${money(total)}</strong></div>
          <div class="xm-track"><div class="xm-bar"><span style="width:${pct}%"></span></div>${marks}</div>
          <p class="xm-msg">${msg}</p>
          <p class="xm-fine">Orders with $100+ of home decor items (after discounts, excluding shipping) placed 1 Jan – 24 Dec count. Gift cards, vouchers, gift items and packaging don't, and neither do cancelled or refunded orders. Shows orders made on this device; your final tier is confirmed by us. <a href="christmas-vouchers.html">How Christmas vouchers work</a></p>
        </div>`;
    }
    function memberRewardsHtml(acc) {
      const open = (acc.vouchers || []).filter(v => !v.used);
      const welcome = open.find(v => /welcome/i.test(v.label || ""));
      const others = open.filter(v => v !== welcome);
      return `
        <div class="ar-grid">
          <div class="ar-card">
            <div class="ar-ic">🎉</div>
            <h4>10% off one item in your first order</h4>
            ${welcome
              ? `<p>Ready to use on your next order. Code <strong>${welcome.code}</strong></p><button class="btn btn--dark btn--sm" onclick="applyVoucher('${welcome.code}')">Apply to next order</button>`
              : `<p>You've used your first-order discount. Thank you for shopping with us.</p>`}
          </div>
          <div class="ar-card">
            <div class="ar-ic">💌</div>
            <h4>30% referral reward</h4>
            <p>When a friend you refer books a service or makes their first purchase, you get 30% off your next service or order.</p>
            <a class="btn btn--dark btn--sm" href="refer-a-friend.html#my-link">Get my share link</a>
          </div>
          <div class="ar-card">
            <div class="ar-ic">🎄</div>
            <h4>Christmas vouchers</h4>
            <p>Shop our home decor 3 or more times in the year and earn a Christmas voucher of up to $300. T&amp;Cs apply.</p>
            <a class="btn btn--dark btn--sm" href="christmas-vouchers.html">How it works</a>
          </div>
        </div>
        <div id="refProgress"></div>
        ${others.length ? `<div style="margin-top:14px">${vouchersHtml(others)}</div>` : ""}`;
    }
    function vouchersHtml(vs) {
      return vs.map((v) => `
        <div class="voucher">
          <div><div class="v-amt">$${v.amount} voucher</div><div class="v-code">${v.label || "Reward"} · Code ${v.code}</div></div>
          <button class="btn btn--dark btn--sm" onclick="applyVoucher('${v.code}')">Apply to next order</button>
        </div>`).join("");
    }
    function applyVoucher(code) {
      const acc = getAccount();
      const v = (acc.vouchers || []).find(x => x.code === code && !x.used);
      if (!v) return;
      if (typeof setVoucher === "function") setVoucher({ code: v.code, amount: v.amount, label: v.label });
      showToast("Voucher applied, it'll show at checkout ✦");
      location.href = "cart.html";
    }
    // ---- Orders & receipts ----
    function getStoredOrders(email) {
      try {
        const all = JSON.parse(localStorage.getItem("dm_orders") || "{}");
        return (email && all[email]) ? all[email] : [];
      } catch (e) { return []; }
    }
    function renderOrders(orders) {
      window._orders = orders || [];
      if (!orders || !orders.length) {
        return `<div style="border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted)">
          You have no orders yet. <a href="shop.html">Start shopping →</a><br>
          <small>Your receipts will appear here after checkout.</small></div>`;
      }
      return orders.map((o, i) => `
        <div class="order-wrap">
          <div class="order-row">
            <div class="o-meta">
              <strong>Order ${o.orderNo}</strong>
              <small>${o.date || ""} · ${(o.items || []).reduce((s, it) => s + (it.qty || 1), 0)} item(s)</small>
            </div>
            <div style="text-align:right">
              <div class="price" style="font-family:var(--font-head)">${money(o.total || 0)}</div>
              <button class="link-remove" style="color:var(--rose-deep)" onclick="viewReceipt(${i})">View receipt</button>
              <button class="btn btn--outline btn--sm" style="margin-left:8px" onclick="openOrderTrack(${i}, this)">Track order</button>
            </div>
          </div>
          <div class="order-track" id="otrack${i}" hidden></div>
        </div>`).join("");
    }
    function openOrderTrack(i, btn) {
      const el = document.getElementById("otrack" + i);
      const o = (window._orders || [])[i];
      if (!el || !o) return;
      if (!el.hidden) { el.hidden = true; if (btn) btn.textContent = "Track order"; return; }
      el.hidden = false; if (btn) btn.textContent = "Hide tracking";
      if (typeof renderOrderStatus === "function") renderOrderStatus(o, el);
      el.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
    function viewReceipt(i) {
      const acc = getAccount();
      const o = (acc.orders || [])[i];
      if (!o) return;
      const rows = (o.items || []).map(it =>
        `<tr><td>${it.name || it.id}${it.qty > 1 ? " × " + it.qty : ""}</td><td style="text-align:right">${money((it.price || 0) * (it.qty || 1))}</td></tr>`
      ).join("");
      const w = window.open("", "_blank", "width=460,height=680");
      w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Receipt ${o.orderNo}</title>
        <style>body{font-family:Georgia,serif;color:#2C2623;max-width:420px;margin:24px auto;padding:0 20px}
        h1{font-size:1.5rem;color:#0B1F3A;margin:0}.sub{color:#888;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase}
        table{width:100%;border-collapse:collapse;margin:18px 0;font-size:.92rem}td{padding:7px 0;border-bottom:1px solid #eee}
        .tot td{border:0;font-weight:700;padding-top:12px}.meta{font-size:.85rem;color:#555;margin:10px 0}
        .thanks{margin-top:24px;color:#C6A15B}button{margin-top:20px;padding:10px 18px;background:#0B1F3A;color:#fff;border:0;border-radius:8px;cursor:pointer;font-family:inherit}
        @media print{button{display:none}}</style></head><body>
        <h1>Samira Home Decor</h1><div class="sub">Purchase receipt</div>
        <div class="meta"><strong>Order ${o.orderNo}</strong><br>${o.date || ""}<br>${acc.name || ""} · ${acc.email}<br>Member No. ${acc.memberNo || ""}</div>
        <table>${rows}
          ${o.shipping ? `<tr><td>Shipping</td><td style="text-align:right">${money(o.shipping)}</td></tr>` : `<tr><td>Shipping</td><td style="text-align:right">Free</td></tr>`}
          <tr class="tot"><td>Total</td><td style="text-align:right">${money(o.total || 0)}</td></tr>
        </table>
        <div class="meta">samirahomedecor.com.au</div>
        <div class="thanks">Thank you for shopping with Samira Home Decor ✦</div>
        <div class="thanks" style="font-size:.85rem;margin-top:6px">Follow us: <a href="https://www.instagram.com/sys_samira1">Instagram @sys_samira1</a> · <a href="https://www.tiktok.com/@sys_samira">TikTok</a> · <a href="https://www.youtube.com/@sys_samira">YouTube</a></div>
        <button onclick="window.print()">🖨 Print / Save as PDF</button>
        </body></html>`);
      w.document.close();
    }

    // ---- Download membership card as a PNG ----
    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath(); ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
    }
    function downloadCard() {
      const acc = getAccount(); if (!acc) return;
      const W = 1012, H = 640, c = document.createElement("canvas");
      c.width = W; c.height = H;
      const ctx = c.getContext("2d");
      const g = ctx.createLinearGradient(0, 0, W, H);
      g.addColorStop(0, "#0B1F3A"); g.addColorStop(1, "#061525");
      ctx.fillStyle = g; roundRect(ctx, 0, 0, W, H, 42); ctx.fill();
      // decorative sparkle
      ctx.fillStyle = "rgba(255,255,255,0.08)"; ctx.font = "260px Georgia, serif";
      ctx.fillText("✦", 690, 330);
      // brand + tier
      ctx.fillStyle = "#fff"; ctx.font = "600 58px Georgia, serif"; ctx.fillText("SYS", 62, 118);
      ctx.fillStyle = "rgba(255,255,255,0.72)"; ctx.font = "500 22px Arial"; ctx.textAlign = "left";
      ctx.fillText("M E M B E R   C A R D", 66, 156);
      // name
      ctx.fillStyle = "#fff"; ctx.font = "700 52px Georgia, serif";
      ctx.fillText((acc.name || acc.email).slice(0, 26), 62, 360);
      // member number
      ctx.fillStyle = "#E0C992"; ctx.font = "500 20px Arial"; ctx.fillText("MEMBER NO.", 62, 420);
      ctx.fillStyle = "#fff"; ctx.font = "500 34px 'Courier New', monospace"; ctx.fillText(acc.memberNo || "", 62, 460);
      // since
      ctx.fillStyle = "#E0C992"; ctx.font = "500 20px Arial"; ctx.fillText("MEMBER SINCE", 560, 420);
      ctx.fillStyle = "#fff"; ctx.font = "500 30px Arial"; ctx.fillText(acc.memberSince || "today", 560, 458);
      // footer
      ctx.fillStyle = "rgba(215,224,205,0.9)"; ctx.font = "20px Arial";
      ctx.fillText("samirahomedecor.com.au", 62, 566);
      ctx.fillText((acc.email || "").slice(0, 46), 62, 598);
      const a = document.createElement("a");
      a.href = c.toDataURL("image/png");
      a.download = "Samira Home Decor-Member-Card.png";
      document.body.appendChild(a); a.click(); a.remove();
      showToast("Member card downloaded ⬇");
    }

    function doLogout() { logoutAccount(); showToast("You've been logged out"); render(); }

    render();
  </script>
</body>
