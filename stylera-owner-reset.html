<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Reset owner password | Samira Home Decor</title><style>:root{font-family:system-ui,sans-serif;color:#0b1f3a;background:#f4efe6}body{margin:0;padding:24px}.panel{max-width:480px;margin:8vh auto;background:#fff;padding:30px;border:1px solid #e6dcc9;border-radius:16px}h1{font-family:Georgia,serif}label{display:block;margin:18px 0 6px;font-weight:600}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #b7a88b;border-radius:8px;font:inherit}button{margin-top:18px;padding:12px 18px;background:#0b1f3a;color:#fff;border:0;border-radius:8px;cursor:pointer}button:disabled{opacity:.6}a{color:#0b1f3a}#status{margin-top:18px;min-height:2em;white-space:pre-wrap}</style></head><body><main class="panel"><p>SAMIRA HOME DECOR · OWNER ACCESS</p><h1>Reset your password</h1><p>Enter the email associated with your Stylera support administrator account. We will email a secure password reset link if the account is eligible.</p><form id="request"><label for="email">Administrator email</label><input id="email" type="email" autocomplete="email" required><button type="submit">Email reset link</button></form><form id="change" hidden><label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="12" required><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required><button type="submit">Save new password</button></form><p id="status" role="status" aria-live="polite"></p><p><a href="/stylera-supabase-inbox.html">Return to Owner Dashboard</a></p></main><script src="/js/stylera-supabase-config.js"></script><script type="module">import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';const cfg=window.STYLERA_SUPABASE_CONFIG,request=document.getElementById('request'),change=document.getElementById('change'),status=document.getElementById('status');const say=x=>status.textContent=x;if(!cfg?.url||!cfg?.publishableKey){say('Password reset is temporarily unavailable. Please contact the site administrator.')}else{const client=createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:false,detectSessionInUrl:true,autoRefreshToken:false}});let recovery=false;const showRecovery=()=>{recovery=true;request.hidden=true;change.hidden=false;say('Choose a new password for your administrator account.')};const params=new URLSearchParams(location.search),hash=new URLSearchParams(location.hash.slice(1));if(params.get('error')||hash.get('error'))say('Reset link could not be verified. Please request a new link.');else if(hash.get('type')==='recovery'){client.auth.getSession().then(({data,error})=>{if(!error&&data?.session)showRecovery();else say('Reset link could not be verified. Please request a new link.')})}else if(params.get('code')){client.auth.exchangeCodeForSession(params.get('code')).then(({data,error})=>{if(!error&&data?.session)showRecovery();else say('Reset link expired or could not be verified. Please request another.')})}client.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')showRecovery()});request.addEventListener('submit',async e=>{e.preventDefault();const button=request.querySelector('button');button.disabled=true;try{const {error}=await client.auth.resetPasswordForEmail(document.getElementById('email').value.trim(),{redirectTo:location.origin+'/stylera-owner-reset.html'});if(error)throw error;say('If this email is eligible, a password reset link will arrive shortly. Check your inbox and spam folder.')}catch(error){say('Unable to send reset email: '+error.message)}finally{button.disabled=false}});change.addEventListener('submit',async e=>{e.preventDefault();if(!recovery){say('Open the secure link from your reset email first.');return}const a=document.getElementById('newPassword').value,b=document.getElementById('confirmPassword').value;if(a!==b){say('Passwords do not match.');return}const button=change.querySelector('button');button.disabled=true;try{const {error}=await client.auth.updateUser({password:a});if(error)throw error;await client.auth.signOut();change.hidden=true;say('Password updated. Return to the Owner Dashboard and sign in with your new password.')}catch(error){say('Unable to update password: '+error.message)}finally{button.disabled=false}})}</script></body></html>
